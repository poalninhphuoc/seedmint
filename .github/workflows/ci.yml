name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Turborepo and Next.js build caches (apps/*/.next/cache appears once apps exist).
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            **/.next/cache
          key: ${{ runner.os }}-node${{ matrix.node }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-node${{ matrix.node }}-build-

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
